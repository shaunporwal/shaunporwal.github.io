<header class="site-header">
  <div class="shell header-row">
    <a class="brand" href="{root}index.html">{name}</a>
    <nav class="nav-links" aria-label="Main" data-nav-links>
{page_links}
      <span class="nav-indicator" aria-hidden="true"></span>
    </nav>
    <a class="btn btn-primary btn-sm header-cta" href="{cal}" target="_blank" rel="noopener">Book a call</a>
    <button class="menu-button" type="button" popovertarget="menu" aria-label="Menu">

      <svg class="icon-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <nav id="menu" class="menu-panel" popover aria-label="Menu">
{menu_links}
      <a class="btn btn-primary" href="{cal}" target="_blank" rel="noopener">Book a call</a>
    </nav>
  </div>
</header>
