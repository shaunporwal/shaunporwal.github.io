<main class="page">
  <h1 class="page-title">Stuff</h1>

  <div class="model-gallery" aria-label="3D objects">
    <div class="model-card">
      <model-viewer
        src="media/heron.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        alt="3D heron model">
      </model-viewer>
      <p>Heron</p>
    </div>

    <div class="model-card">
      <model-viewer
        src="media/nft_monkey.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        alt="3D monkey model">
      </model-viewer>
      <p>Monkey</p>
    </div>

    <div class="model-card">
      <model-viewer
        src="media/banana_upright2.glb"
        camera-controls
        auto-rotate
        camera-target="-0.16m 0m 0.88m"
        camera-orbit="45deg 75deg 8m"
        shadow-intensity="1"
        exposure="1"
        alt="3D banana model laying flat">
      </model-viewer>
      <p>Banana Laying Flat</p>
    </div>
  </div>

  <div class="image-feature">
    <img src="media/260608-iphone-macro-eye.png" alt="iPhone macro photo of an eye">
    <p>Shaun's right eye</p>
  </div>
