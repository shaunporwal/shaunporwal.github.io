name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Print the PDFs that pages name in data/pages.json
        run: python3 scripts/render_pdf.py
        env:
          # The runner is a throwaway machine and the page is ours, so Chrome may run without its sandbox.
          CHROME_ARGS: --no-sandbox

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # site/AGENTS.md is for agents, not visitors.
          exclude_assets: '.github,AGENTS.md'
