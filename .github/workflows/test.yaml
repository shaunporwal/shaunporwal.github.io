name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install poppler (pdftotext, pdfinfo and pdffonts, for the resume PDF checks)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install ruff (version from ruff.toml)
        run: pipx install "ruff$(sed -n 's/^required-version = "\(.*\)"/\1/p' ruff.toml)"

      - name: Run tests
        run: make test
        env:
          # The print-layout check prints with the runner's Google Chrome, as the publish step does.
          CHROME_ARGS: --no-sandbox
