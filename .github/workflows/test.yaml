name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run shell script tests
        run: bash tests/test_update_dcurves_downloads.sh
